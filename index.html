<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI爆款文案大师</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#050816;
color:#fff;
font-family:Arial,"Microsoft YaHei",sans-serif;
}

.container{
width:100%;
max-width:900px;
margin:auto;
padding:20px;
}


.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 0;
}

.logo{
font-size:22px;
font-weight:bold;
color:#ffd700;
}


.nav{
color:#aaa;
font-size:14px;
}


.hero{
text-align:center;
padding:40px 10px;
}


.hero h1{
font-size:34px;
line-height:1.4;
color:#ffd700;
}


.hero p{
margin-top:15px;
color:#aaa;
font-size:16px;
}


.card{

background:#111827;

border-radius:20px;

padding:20px;

margin-top:20px;

}


h2{
font-size:20px;
}


textarea{

width:100%;

height:120px;

margin-top:15px;

background:#050816;

border:1px solid #333;

border-radius:12px;

padding:15px;

color:white;

font-size:16px;

}


select{

width:100%;

margin-top:15px;

height:50px;

background:#050816;

color:white;

border:1px solid #333;

border-radius:12px;

padding:10px;

font-size:15px;

}


button{

width:100%;

height:55px;

margin-top:20px;

border:0;

border-radius:30px;

background:#ffd700;

font-size:18px;

font-weight:bold;

}


.result{

margin-top:20px;

background:#050816;

padding:20px;

border-radius:15px;

line-height:1.8;

}


.tag{

display:inline-block;

background:#222;

color:#ffd700;

padding:6px 12px;

border-radius:20px;

margin:5px;

}


.features{

margin-top:20px;

}


.item{

background:#111827;

padding:20px;

border-radius:15px;

margin-top:15px;

}


.item h3{

color:#ffd700;

}


.footer{

text-align:center;

margin:40px 0;

color:#777;

}


@media(max-width:600px){

.container{

padding:15px;

}


.hero h1{

font-size:30px;

}


.nav{

display:none;

}


.card{

padding:18px;

}


}

</style>

</head>


<body>


<div class="container">


<div class="header">

<div class="logo">
🔥 AI爆款文案大师
</div>


<div class="nav">
AI创作平台
</div>

</div>



<div class="hero">

<h1>

每天10秒<br>

生成爆款内容

</h1>


<p>

AI帮你创作短视频、小说、营销文案

</p>


</div>



<div class="card">


<h2>
✍️ 开始创作
</h2>


<textarea placeholder="请输入主题，例如：35岁男人重新开始人生"></textarea>



<select>

<option>选择创作类型</option>

<option>短视频口播</option>

<option>小红书笔记</option>

<option>朋友圈文案</option>

<option>小说章节</option>

<option>视频脚本</option>

<option>商品营销</option>

</select>



<select>

<option>选择文案风格</option>

<option>人生感悟</option>

<option>情感共鸣</option>

<option>职场励志</option>

<option>创业逆袭</option>

<option>武侠古风</option>

<option>玄幻修仙</option>

<option>言情爱情</option>

<option>悬疑故事</option>

</select>



<button>

✨ 立即生成爆款文案

</button>



<div class="result">

<h2>
🤖 AI生成示例
</h2>

<br>

标题：

<br>

35岁以后，人生真正的开始，是重新认识自己。


<br><br>

开头3秒：

<br>

没有人能定义你的未来，除了你自己。


<br><br>

标签：

<br>

<span class="tag">
#人生感悟
</span>

<span class="tag">
#成长
</span>

<span class="tag">
#励志
</span>


</div>


</div>



<div class="features">


<div class="item">

<h3>
🔥 爆款标题生成
</h3>

<p>
自动生成高点击标题
</p>

</div>



<div class="item">

<h3>
🎬 视频脚本创作
</h3>

<p>
生成完整短视频脚本
</p>

</div>



<div class="item">

<h3>
📖 AI小说助手
</h3>

<p>
辅助小说人物和剧情创作
</p>

</div>


</div>



<div class="footer">

AI爆款文案大师 · 智能创作平台

</div>


</div>


</body>

</html>
